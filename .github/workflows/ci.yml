name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            .
      - name: The core never depends on anything outside core/
        run: |
          if grep -rn 'path = "\.\./' core --include=Cargo.toml; then
            echo "::error::core/ must stand alone"; exit 1
          fi
      - name: core
        working-directory: core
        run: cargo test --workspace --locked
      - name: freshet (default members)
        run: cargo test --locked
      - name: freshet-serve over HTTP
        run: cargo test --locked -p freshet-serve --features http
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: freshet-sdk (stdlib only)
        working-directory: sdks/python
        run: python -m unittest -v
      - name: freshet-airflow (Airflow-bound tests skip without Airflow)
        working-directory: integrations/airflow
        run: |
          python -m pip install -q "pytest>=7"
          python -m pytest -q
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --locked --out dist -m crates/freshet-py/Cargo.toml
      - name: freshet-planner wheel
        run: |
          python -m pip install --no-index --find-links dist freshet-planner
          cd crates/freshet-py/tests && python -m unittest -v
