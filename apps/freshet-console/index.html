<!doctype html>
<html lang="en" data-theme="light" data-focus="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freshet</title>
<meta name="description" content="Freshet's console: the states a freshet-state-server keeps, every commit to them, and each version's snapshot.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1e3fae" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191815" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/antonio-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/console.css">
<!-- Blocking on purpose: it sets the firing (light/dark) and focus mode before first paint. -->
<script src="assets/theme.js"></script>
<!-- Deployment settings (API base, demo). Replaced per install; see README. -->
<script src="config.js"></script>
<script type="module" src="assets/js/app.js"></script>
</head>
<body>
<!--
THESIS: the landing page's kiln shelf, kept for one team's own state server. Each state
is a shelf of models; the console is its firing log: every commit on record, what each
one moved, and the snapshot each left. One cobalt glaze at three densities still means
one thing: how far a commit reached.
-->
<a class="skip" href="#page">Skip to content</a>

<header class="top">
  <div class="top__in">
    <a class="logo" href="#/states" aria-label="Freshet, every state">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 7h16l-1.4 18.5c-.1 1.4-13.1 1.4-13.2 0z" class="logo__cup"/><path d="M7.5 6.5h17v5c-1 0-1.4.6-1.5 1.6l-.2 6.2c0 1.4-2 1.4-2 0l-.2-5c0-1-1.6-1.4-2.2-.2l-.3 9c0 1.6-2.2 1.6-2.2 0l-.3-8.6c0-1.2-1.7-1.2-2 0l-.2 3c0 1.3-1.9 1.3-1.9 0l-.1-4.2c0-.9-.8-1.4-1.4-1.4z" class="logo__glaze"/></svg>
      <span>Freshet</span>
    </a>
    <span class="stamp" id="access" hidden></span>
    <div class="scope" id="scope" hidden>
      <label class="vh" for="state-select">State</label>
      <select id="state-select"></select>
    </div>
    <div class="top__tools">
      <button class="tool" type="button" id="open-palette" aria-keyshortcuts="Control+K Meta+K"><span class="tool__label">Go to</span> <kbd>⌘K</kbd></button>
      <button class="tool" type="button" id="theme-toggle" aria-label="Theme: system"><span class="tool__dot" aria-hidden="true"></span><span class="tool__label" id="theme-label">System</span></button>
      <button class="tool" type="button" id="focus-toggle" aria-pressed="false" aria-keyshortcuts="."><span class="tool__label">Focus</span><span class="vh"> mode</span></button>
      <button class="tool" type="button" id="account" hidden></button>
    </div>
  </div>
</header>

<div class="frame" id="frame">
  <aside class="side" id="side" hidden aria-label="Console">
    <nav aria-label="Pages">
      <p class="side__label">State</p>
      <ol>
        <li><a href="#/overview" data-route="overview"><span class="side__name">Overview</span><span class="side__key" aria-hidden="true">g o</span></a></li>
        <li><a href="#/history" data-route="history"><span class="side__name">History</span><span class="side__key" aria-hidden="true">g h</span></a></li>
        <li><a href="#/snapshot" data-route="snapshot"><span class="side__name">Snapshot</span><span class="side__key" aria-hidden="true">g n</span></a></li>
      </ol>
      <p class="side__label">Server</p>
      <ol>
        <li><a href="#/states" data-route="states"><span class="side__name">Every state</span><span class="side__key" aria-hidden="true">g s</span></a></li>
      </ol>
    </nav>
    <p class="side__foot">Press <kbd>?</kbd> for shortcuts. Read-only: commits come from <code>freshet</code> itself.
      <a href="https://github.com/lucheeseng827/freshet/blob/main/docs/OPERATIONS.md" rel="noopener">Running the server</a></p>
  </aside>

  <main class="main" id="main">
    <div class="page" id="page" tabindex="-1">
      <p class="loading" role="status">Opening the kiln log…</p>
      <noscript><p class="note">The console needs JavaScript. The CLI does not: <code>freshet history --state http://&lt;this-server&gt;/v1/&lt;name&gt;</code>.</p></noscript>
    </div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="vh" id="live" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
