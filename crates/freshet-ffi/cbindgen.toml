# `cbindgen` config for include/planner.h. Regenerate after changing a symbol:
#
#   cbindgen --config cbindgen.toml --crate freshet-ffi --output include/planner.h
#
# CI runs the same command with `--verify`, which fails when the committed header
# no longer matches the Rust source.
language = "C"
include_guard = "PLANNER_FFI_H"
autogen_warning = "/* Generated by cbindgen from crates/freshet-ffi/src/lib.rs. Do not edit by hand. */"
include_version = false
sys_includes = ["stdint.h"]
no_includes = true
documentation = true
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true
header = """
/*
 * The C ABI of the Freshet backfill planner.
 *
 * Memory contract: every non-NULL string planner_plan returns is owned by the
 * library and MUST be released with planner_string_free — never with free().
 * planner_contract_version returns a static string: never free it.
 * No function unwinds into C; errors come back as JSON with an "error" field.
 */"""
